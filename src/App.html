}

function renderSections() {
 const L = LANG[currentLang];
 const container = document.getElementById('checklistSections');
 // Keep typed answers when sections are re-rendered (checklist toggle / language switch)
 const saved = snapshotFields(container);
 container.innerHTML = '';


 CHECKLISTS.forEach(cl => {
   if (!selectedChecklists.has(cl.id)) return;


   const div = document.createElement('div');
   div.className = 'card';
   div.id = 'section-' + cl.id;


   if (cl.isOSH) {
     div.innerHTML = renderOSHSection(cl, L);

     div.innerHTML = renderStandardSection(cl, L);

   container.appendChild(div);
   // Re-attach photo listeners
   div.querySelectorAll('.photo-input').forEach(input => {
     input.addEventListener('change', (e) => handlePhotoUpload(e, input.dataset.key));
   });
 });


 restoreFields(container, saved);
 renderJumpNav();

}


function snapshotFields(root) {
 const saved = {};
 root.querySelectorAll('input[type="text"][id], textarea[id]').forEach(el => {
   if (el.value) saved[el.id] = el.value;
 });
 root.querySelectorAll('input[type="radio"]:checked').forEach(el => {
   saved['radio:' + el.name] = el.value;
 });
 return saved;
}


function restoreFields(root, saved) {
 Object.entries(saved).forEach(([k, v]) => {
   if (k.startsWith('radio:')) {
     const r = root.querySelector(`input[name="${k.slice(6)}"][value="${v}"]`);
     if (r) r.checked = true;
   } else {
     const el = document.getElementById(k);
     if (el) el.value = v;
   }
 });
 Object.entries(photoData).forEach(([key, p]) => {
   const preview = document.getElementById('preview_' + key);
   const img = document.getElementById('previewImg_' + key);
   if (preview && img) {
     img.src = 'data:' + p.mimeType + ';base64,' + p.base64;
     preview.style.display = 'block';
   }
 });
 root.querySelectorAll('.audit-item').forEach(item => {
   const hasText = [...item.querySelectorAll('.item-details input[type="text"]')].some(i => i.value);
   if (hasText || photoData[item.dataset.key]) item.classList.add('open');
 });
 updateOSHScore();
}

// ══════════════════════════════════════════════════════════
function checklistProgress(cl) {
 if (cl.isOSH) {
   const total = cl.sections.reduce((n, sec) => n + sec.items.length, 0);
   const done = document.querySelectorAll(`#section-${cl.id} input[type="radio"]:checked`).length;
   return { done, total };
 }
 const done = cl.items.filter(i => statusMap[`${cl.id}_${i.bil}`]).length;
 return { done, total: cl.items.length };
}


function updateCounts() {
 const L = LANG[currentLang];
 const tally = { compliant: 0, improve: 0, noncompliant: 0, na: 0, open: 0 };
 const oshMap = { Ya: 'compliant', Tidak: 'noncompliant', TB: 'na' };
 CHECKLISTS.forEach(cl => {
   if (!selectedChecklists.has(cl.id)) return;
   const { done, total } = checklistProgress(cl);
   const count = document.getElementById('count_' + cl.id);
   if (count) {
     count.textContent = done + '/' + total;
     count.classList.toggle('done', done === total);
   }
   const chip = document.getElementById('jump_' + cl.id);
   if (chip) chip.classList.toggle('done', done === total);
   if (cl.isOSH) {
     document.querySelectorAll(`#section-${cl.id} input[type="radio"]:checked`).forEach(r => tally[oshMap[r.value]]++);
     tally.open += total - done;
   } else {
     cl.items.forEach(i => {
       const st = statusMap[`${cl.id}_${i.bil}`];
       if (st) tally[st]++; else tally.open++;
     });
   }
 });
 const el = document.getElementById('tally');
 if (el) {
   el.innerHTML = [['t-c', 'compliant'], ['t-i', 'improve'], ['t-n', 'noncompliant'], ['t-na', 'na'], ['t-o', 'open']]
     .map(([cls, k], i) => `<div class="tally-cell ${cls}"><b>${tally[k]}</b><span>${L.tally[i]}</span></div>`)
     .join('');
 }
}

// ══════════════════════════════════════════════════════════
function updateOSHScore() {
 const radios = document.querySelectorAll('#section-cl17 input[type="radio"]:checked');
 let ya = 0, total = 0;
 radios.forEach(r => {
   if (r.value === 'Ya') { ya++; total++; }
   else if (r.value === 'Tidak') { total++; }
   // TB excluded from denominator
 });
 const score = total > 0 ? Math.round((ya / total) * 100) : 0;
 const el = document.getElementById('oshScoreValue');
 if (el) {
   el.textContent = total > 0 ? score + '%' : '—';
   el.style.color = total === 0 ? '' : score >= 80 ? 'var(--teal)' : score >= 60 ? 'var(--gold)' : 'var(--red)';
 }
 updateCounts();
}


// ══════════════════════════════════════════════════════════
// PHOTO HANDLING
// ══════════════════════════════════════════════════════════
const PHOTO_MAX_PX = 1280;    // long side after downscale
const PHOTO_JPEG_QUALITY = 0.8;

function handlePhotoUpload(e, key) {
 const file = e.target.files[0];
 if (!file) return;
 if (file.size > 5 * 1024 * 1024) { showToast('File too large (max 5MB)', 'error'); return; }

 const reader = new FileReader();
 reader.onload = (evt) => {
   const original = evt.target.result; // data URL of the untouched file
   // Downscale first; if the browser cannot decode the image, fall back to the original file
   downscaleImage(original).then(dataUrl => {
     setPhoto(key, dataUrl, dataUrl === original ? file.name : file.name.replace(/\.[^.]+$/, '') + '.jpg',
       dataUrl === original ? file.type : 'image/jpeg');
   });
 };
 reader.readAsDataURL(file);
}

// Resize to max PHOTO_MAX_PX on the long side and re-encode as JPEG (smaller uploads, fits Sheets image limits)
function downscaleImage(dataUrl) {
 return new Promise(resolve => {
   const img = new Image();
   img.onload = () => {
     try {
       const scale = Math.min(1, PHOTO_MAX_PX / Math.max(img.width, img.height));
       const w = Math.max(1, Math.round(img.width * scale));
       const h = Math.max(1, Math.round(img.height * scale));
       const canvas = document.createElement('canvas');
       canvas.width = w;
       canvas.height = h;
       const ctx = canvas.getContext('2d');
       ctx.fillStyle = '#fff'; // JPEG has no alpha — flatten PNG transparency onto white
       ctx.fillRect(0, 0, w, h);
       ctx.drawImage(img, 0, 0, w, h);
       resolve(canvas.toDataURL('image/jpeg', PHOTO_JPEG_QUALITY));
     } catch (err) {
       resolve(dataUrl);
     }
   };
   img.onerror = () => resolve(dataUrl);
   img.src = dataUrl;
 });
}

function setPhoto(key, dataUrl, fileName, mimeType) {
 photoData[key] = { base64: dataUrl.split(',')[1], fileName, mimeType };
 const preview = document.getElementById('preview_' + key);
 const img = document.getElementById('previewImg_' + key);
 if (preview && img) {
   img.src = dataUrl;
   preview.style.display = 'block';
 }
}


function removePhoto(key) {
 delete photoData[key];
 const preview = document.getElementById('preview_' + key);
 const input = document.getElementById('photo_' + key);
 if (preview) preview.style.display = 'none';
 if (input) input.value = '';
}

// ══════════════════════════════════════════════════════════
// SUBMIT
// ══════════════════════════════════════════════════════════
function submitForm() {
 const L = LANG[currentLang];


 // Validate required fields
 const auditor = document.getElementById('auditor').value.trim();
 const jawatan = document.getElementById('jawatan').value.trim();
 const jabatan = document.getElementById('jabatan').value;
 const tarikh = document.getElementById('tarikh').value;


 if (!auditor || !jawatan || !jabatan || !tarikh) {
   showToast('Please fill in all required fields / Sila lengkapkan semua medan wajib', 'error');
   window.scrollTo({ top: 0, behavior: 'smooth' });
   return;
 }
 if (selectedChecklists.size === 0) {
   showToast('Please select at least one checklist / Sila pilih sekurang-kurangnya satu senarai semak', 'error');
   return;
 }


 // Build data payload
 const sections = [];


 CHECKLISTS.forEach(cl => {
   if (!selectedChecklists.has(cl.id)) return;


   if (cl.isOSH) {
     const oshItems = [];
     cl.sections.forEach(sec => {
       sec.items.forEach(item => {
         const key = cl.id + '_' + item.replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_]/g,'');
         const checked = document.querySelector(`input[name="${key}"]:checked`);
         oshItems.push({
           bil: item.split('.')[0],
           perkara: item,
           status: checked ? checked.value : '',
           penemuan: '',
           tindakan: '',
           susulan: '',
           fotoUrl: '',
         });
       });
     });
     sections.push({
       title: cl.num + '. ' + cl.title,
       items: oshItems,
       lainLain: document.getElementById('osh_remarks')?.value || '',
     });
   } else {
     const items = cl.items.map(item => {
       const key = `${cl.id}_${item.bil}`;
       return {
         bil: item.bil,
         perkara: item.perkara,
         status: getStatusLabel(statusMap[key] || '', L),
         penemuan: document.getElementById('penemuan_' + key)?.value || '',
         tindakan: document.getElementById('tindakan_' + key)?.value || '',
         susulan: document.getElementById('susulan_' + key)?.value || '',
         fotoUrl: photoData[key] ? '[Photo attached]' : '',
         photoData: photoData[key] || null,
       };
     });
     sections.push({
       title: cl.num + '. ' + cl.title,
       items,
       lainLain: document.getElementById('lainlain_' + cl.id)?.value || '',
     });
   }
 });


 const formData = {
   auditor,
   jawatan,
   jabatan,
   tarikh,
   masaMula: document.getElementById('masaMula').value || '',
   masaTamat: document.getElementById('masaTamat').value || '',
   bahasa: currentLang === 'en' ? 'English' : 'Bahasa Malaysia',
   rumusan: document.getElementById('rumusan').value || '',
   isuKritikal: document.getElementById('isuKritikal').value || '',
   sections,
 };


 // Show loading
 showLoading(L.submitting);


 // Upload photos first, then submit
 uploadPhotosAndSubmit(formData);
}


function getStatusLabel(status, L) {
 const map = { compliant: L.status[0], improve: L.status[1], noncompliant: L.status[2], na: L.status[3] };
 return map[status] || '';
}


function uploadPhotosAndSubmit(formData) {
 // Collect all photos that need uploading
 const photoPromises = [];
 formData.sections.forEach(sec => {
   sec.items.forEach(item => {
     if (item.photoData) {
       const p = new Promise((resolve) => {
         google.script.run
           .withSuccessHandler((result) => {
             item.fotoUrl = result.success ? result.url : '[Upload failed]';
             delete item.photoData;
             resolve();
           })
           .withFailureHandler(() => {
             item.fotoUrl = '[Upload failed]';
             delete item.photoData;
             resolve();
           })
           .uploadPhoto(item.photoData.base64, item.photoData.fileName, item.photoData.mimeType);
       });
       photoPromises.push(p);
     }
   });
 });


 Promise.all(photoPromises).then(() => {
   // Clean up photoData before sending
   formData.sections.forEach(sec => {
     sec.items.forEach(item => { delete item.photoData; });
   });


   google.script.run
     .withSuccessHandler(handleSuccess)
     .withFailureHandler(handleError)
     .submitForm(formData);
 });
}


function handleSuccess(result) {
 hideLoading();
 if (result.success) {
   document.getElementById('mainForm').style.display = 'none';
   document.getElementById('successScreen').style.display = 'block';
   const L = LANG[currentLang];
   document.getElementById('s-title').textContent = L.success_title;
   document.getElementById('s-body').textContent = L.success_body;
   document.getElementById('s-btn').textContent = L.new_round;
   window.scrollTo({ top: 0, behavior: 'smooth' });
 } else {
   showToast(result.message, 'error');
 }
}


function handleError(error) {
 hideLoading();
 showToast('Error: ' + error.message, 'error');
}


function resetForm() {
 document.getElementById('mainForm').style.display = 'block';
 document.getElementById('successScreen').style.display = 'none';
 document.getElementById('mainForm').reset?.();
 selectedChecklists.clear();
 Object.keys(photoData).forEach(k => delete photoData[k]);
 Object.keys(statusMap).forEach(k => delete statusMap[k]);
 ['rumusan', 'isuKritikal', 'masaTamat'].forEach(id => { document.getElementById(id).value = ''; });
 renderChecklistGrid();
 document.getElementById('checklistSections').innerHTML = '';
 renderJumpNav();
 document.getElementById('summaryCard').style.display = 'none';
 document.getElementById('submitSection').style.display = 'none';
 setTodayDate();
 updateProgress();
 window.scrollTo({ top: 0, behavior: 'smooth' });
}


// ══════════════════════════════════════════════════════════
// UI HELPERS
// ══════════════════════════════════════════════════════════
function showLoading(text) {
 document.getElementById('loadingText').textContent = text || 'Loading...';
 document.getElementById('loadingOverlay').classList.add('active');
 document.getElementById('submitBtn').disabled = true;
}
function hideLoading() {
 document.getElementById('loadingOverlay').classList.remove('active');
 document.getElementById('submitBtn').disabled = false;
}


let toastTimeout;
function showToast(msg, type) {
 const toast = document.getElementById('toast');
 toast.textContent = msg;
 toast.className = 'toast ' + (type || '');
 setTimeout(() => toast.classList.add('show'), 10);
 clearTimeout(toastTimeout);
 toastTimeout = setTimeout(() => toast.classList.remove('show'), 3500);
}
